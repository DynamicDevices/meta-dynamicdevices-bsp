#@TYPE: Machine
#@NAME: Dynamic Devices i.MX 8M Mini Jaguar SCREEN board with LPDDR4
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for Dynamic Devices i.MX 8M Mini Jaguar SCREEN board with LPDDR4
#@MAINTAINER: Alex J Lennon  <ajlennon@dynamicdevices.co.uk>

MACHINEOVERRIDES =. "imx8mm-lpddr4-evk:"

require conf/machine/imx8mm-lpddr4-evk.conf
require conf/machine/include/display-panel.inc

# Reference panel and physical mounting used by the Active Screen assembly.
DISPLAY_PANEL_PROFILE = "santek-st1010b3cyol-hx8279d"
DISPLAY_PANEL_ROTATION = "90"
DISPLAY_FBCON_ROTATE = "1"
DISPLAY_WESTON_TRANSFORM = "rotate-90"

KMACHINE = "imx8mmevk"
KERNEL_MODULE_AUTOLOAD:imx8mm-jaguar-screen = " i2c-dev spidev"

MACHINE_FEATURES:remove:imx8mm-jaguar-screen = " nxp8987-sdio"

# Need to remove nxpiw612 to build SDK as for some reason it errors with a conflict with linux-firmware
MACHINE_FEATURES:append:imx8mm-jaguar-screen = " ax210 display-multimedia"

# Conflicts with firmware-imx
PACKAGE_EXCLUDE = "linux-firmware-iwlwifi-misc"

# NOTE: This is *not* used for the lmp DISTRO / CI. This is just included for local development with lmp-base
KERNEL_DEVICETREE:append:imx8mm-jaguar-screen = " imx8mm-jaguar-screen.dtb"

# Fix imx-vpu-hantro build failure
TOOLCHAIN:pn-imx-vpu-hantro = "gcc"
TOOLCHAIN:pn-imx-vpu-hantro-daemon = "gcc"

# Need to have a non-default SPI buffer
KERNEL_MODULE_PROBECONF:append:imx8mm-jaguar-screen = "spidev"
module_conf_spidev = "options spidev bufsiz=16384"

# Secure boot SE050 into OpTee
MACHINE_FEATURES:append:imx8mm-jaguar-screen = " se05x"
# TODO: This line doesn't appear to take effect so overriding it in the OpTee recipe for now
SE05X_OEFID:imx8mm-jaguar-screen = "0xA200"
