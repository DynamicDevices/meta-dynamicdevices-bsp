# Jaguar Screen TAS2555 development playback path.
# The driver accepts 48 kHz only; use ALSA's plug layer so browser and test
# audio at other sample rates is converted before reaching the ASI1 stream.
pcm.!default {
    type plug
    slave {
        pcm "hw:tas2555audio,0"
        rate 48000
    }
}

ctl.!default {
    type hw
    card "tas2555audio"
}
