# U-Boot proper only; no SPL display or Linux handover changes.
CONFIG_VIDEO=y
CONFIG_VIDEO_MXS=y
CONFIG_VIDEO_IMX_SEC_DSI=y
CONFIG_VIDEO_LT9611_DT510=y
CONFIG_DEFAULT_DEVICE_TREE="imx8mm-jaguar-dt510-uboot"
CONFIG_OF_LIST="imx8mm-jaguar-dt510-uboot"
# CONFIG_VIDEO_LCD_RAYDIUM_RM67191 is not set
# CONFIG_VIDEO_ADV7535 is not set
CONFIG_BMP_24BPP=y
CONFIG_CMD_BMP=y
CONFIG_CMD_HASH=y
CONFIG_HASH_VERIFY=y
CONFIG_SHA256=y
CONFIG_SPLASH_SCREEN=y
CONFIG_SPLASH_SCREEN_ALIGN=y
# CONFIG_VIDEO_LOGO is not set
