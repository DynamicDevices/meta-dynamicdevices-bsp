# Factory / uuu: SPL loads u-boot.itb from user-area LBA 0x300 (boot.cmd bootloader2).
# Mfgtool u-boot already has these; production u-boot needs them for FB: flash bootloader2
# after FB: flash bootloader in the same uuu session.
CONFIG_FSL_FASTBOOT_BOOTLOADER2=y
CONFIG_FSL_FASTBOOT_BOOTLOADER2_OFFSET=0x300
