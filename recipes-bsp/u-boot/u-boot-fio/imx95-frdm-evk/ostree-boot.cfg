# Foundries OSTree boot for imx95-frdm-evk.
#
# Load boot.itb from VFAT p1 and bootm. SPL loads u-boot.itb FIT from user-area LBA 0x300.
#
# partitions-mode flash writes GPT + boot-part via raw mmc write; U-Boot must select the
# user area (mmc dev 0 0) and rescan before mmc 0:1 works. WIC VFAT stores BOOT.ITB
# (uppercase). Do not use fstype/fatls here — GPT is not visible to the partition layer
# until after rescan, and uuu verify uses raw sector md.b @ 0x800 instead.

CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="mmc dev 0 0; mmc rescan; fatload mmc 0:1 ${loadaddr} BOOT.ITB; setenv verify 1; bootm ${loadaddr}; reset"
