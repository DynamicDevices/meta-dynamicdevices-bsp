# Keep U-Boot diagnostics on serial while allowing boot.cmd to own scanout.
CONFIG_VIDEO=y
CONFIG_VIDEO_MXS=y
CONFIG_VIDEO_IMX_SEC_DSI=y
CONFIG_VIDEO_LCD_HIMAX_HX8279D=y
# CONFIG_VIDEO_LCD_RAYDIUM_RM67191 is not set
CONFIG_BMP_24BPP=y
CONFIG_CMD_BMP=y
# Expose the watchdog control command for lab diagnostics, but do not let the
# driver-model watchdog framework start WDOG1 during U-Boot initialization.
# The i.MX WDE/configuration bits are write-once after enable: handing Linux an
# already-running watchdog prevents its restart handler from asserting the
# immediate reset and leaves systemd's 60-second reboot watchdog as fallback.
CONFIG_WDT=y
CONFIG_CMD_WDT=y
# CONFIG_WATCHDOG_AUTOSTART is not set
# SPL otherwise starts the legacy i.MX watchdog before full U-Boot. Once WDOG1
# is enabled its configuration is write-once, so Linux cannot assert the
# immediate restart and has to wait for the 60-second timeout.
# CONFIG_SPL_WATCHDOG is not set
CONFIG_SPLASH_SCREEN=y
CONFIG_SPLASH_SCREEN_ALIGN=y
# CONFIG_VIDEO_LOGO is not set
# Ship without an autoboot countdown. Lab debugging can restore one with
# `fw_setenv bootdelay 3` and return to product behaviour with
# `fw_setenv bootdelay 0`.
CONFIG_BOOTDELAY=0
# Describe and reserve the live U-Boot framebuffer for Linux.
CONFIG_OF_BOARD_SETUP=y
CONFIG_FDT_SIMPLEFB=y
