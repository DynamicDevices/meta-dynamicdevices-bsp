# Keep U-Boot diagnostics on serial while allowing boot.cmd to own scanout.
CONFIG_VIDEO=y
CONFIG_VIDEO_MXS=y
CONFIG_VIDEO_IMX_SEC_DSI=y
CONFIG_VIDEO_LCD_HIMAX_HX8279D=y
# CONFIG_VIDEO_LCD_RAYDIUM_RM67191 is not set
CONFIG_BMP_24BPP=y
CONFIG_CMD_BMP=y
# Expose the watchdog control command for lab diagnostics.  The i.MX WDE bit
# remains write-once once U-Boot has enabled it, so `wdt stop` cannot disable
# this particular watchdog after boot; `wdt reset` is still useful to service
# it while investigating the display path.
CONFIG_WDT=y
CONFIG_CMD_WDT=y
CONFIG_SPLASH_SCREEN=y
CONFIG_SPLASH_SCREEN_ALIGN=y
# CONFIG_VIDEO_LOGO is not set
# Ship without an autoboot countdown. Lab debugging can restore one with
# `fw_setenv bootdelay 3` and return to product behaviour with
# `fw_setenv bootdelay 0`.
CONFIG_BOOTDELAY=0
# Describe and reserve the live U-Boot framebuffer for Linux.
CONFIG_OF_BOARD_SETUP=y
CONFIG_FDT_SIMPLEFB=y
