# Active Screen — Santek ST1010B3CYOL native MIPI DSI (display-only).
# DTS keeps &mipi_dsi + panel@0 status=disabled until electrical SoT
# (lane count, reset/enable, backlight, timings, panel controller IC).
# Interface is MIPI DSI — NOT LVDS; do not enable SN65DSI83 / panel-lvds.
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL_SIMPLE=y
