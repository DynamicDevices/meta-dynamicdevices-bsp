# Waydroid requires the Android Binder IPC devices on the host kernel.
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDERFS=y
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder,anbox-binder,anbox-hwbinder,anbox-vndbinder"

# Mesa minigbm uses the system heap for gralloc metadata; the V4L2/Hantro
# path may require physically contiguous buffers from the CMA heap.
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
CONFIG_DMABUF_HEAPS_CMA=y

# Android 16 userspace lmkd and the 2 GB host profile use pressure stall
# information, memory cgroups with swap accounting, and compressed zram.
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_PSI=y
CONFIG_PSI_DEFAULT_DISABLED=n
CONFIG_SWAP=y
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=y
CONFIG_ZRAM_DEF_COMP_LZ4=y
CONFIG_CRYPTO_LZ4=y
