# NXP PCA9450 — same PMIC as imx8mm-evkb.dts @ i2c-0 / 0x25 (DTS &i2c1).
# Ported from imx8mm-jaguar-dt510 (9242c87): without this the DT node exists and
# the chip responds on the bus, but no driver binds — i2cdetect shows "25"
# instead of "UU", and regulators are not managed in Linux.
# (Wi-Fi VMMC isolation from 5ec67d1 not applied — SCREEN is not on IW612 yet.)
CONFIG_REGULATOR_PCA9450=y
