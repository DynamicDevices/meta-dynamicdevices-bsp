# Active Screen / V3 Room Screen — Himax HX8279-D on native MIPI DSI (display-only).
# Module: Santek ST1010B3CYOL. Schematic 202200.pdf; init txt from Michael 2026-08-08.
# DTS keeps &mipi_dsi + panel@0 + backlight-dsi status=disabled until a panel
# driver (or panel-simple-dsi of_match + init) lands. NOT LVDS.
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_GPIO=y
