# Active Screen / V3 Room Screen — Himax HX8279-D on native MIPI DSI (display-only).
# Module: Santek ST1010B3CYOL. Schematic 202200.pdf; init from Michael 2026-08-08.
# Driver: panel-boe-himax8279d (+ ST1010 of_match patch). NOT LVDS.
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL_BOE_HIMAX8279D=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_GPIO=y
# Keep the U-Boot framebuffer scanned out until the native LCDIF DRM client
# commits the first Linux frame.
CONFIG_DRM_SIMPLEDRM=y
# The product UI owns the panel.  Do not let DRM fbdev allocate and atomically
# commit a zero-filled native framebuffer while initramfs is starting; that
# would replace the inherited U-Boot splash before screen-splash is available.
# Compile this out rather than relying on a kernel argument because OSTree OTA
# deployments preserve their existing kernel command line across updates.
# CONFIG_DRM_FBDEV_EMULATION is not set
# Never attach a VT console to the product display.
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_ROTATION is not set
