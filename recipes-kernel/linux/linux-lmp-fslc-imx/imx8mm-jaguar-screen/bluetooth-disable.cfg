# Active Screen has no product Bluetooth function.  Disable the subsystem so
# neither the inherited UART serdev device nor a USB Bluetooth interface can
# create an HCI controller.
# CONFIG_BT is not set

# The LmP kernel metadata enables the generic Bluetooth protocol and transport
# feature fragments before this machine fragment.  Override their child
# symbols explicitly so kernel_configcheck sees the requested final state,
# rather than reporting each inherited request as unassignable under BT=n.
# CONFIG_BT_6LOWPAN is not set
# CONFIG_BT_RFCOMM is not set
# CONFIG_BT_RFCOMM_TTY is not set
# CONFIG_BT_BNEP is not set
# CONFIG_BT_BNEP_MC_FILTER is not set
# CONFIG_BT_BNEP_PROTO_FILTER is not set
# CONFIG_BT_HIDP is not set
# CONFIG_BT_LE is not set
# CONFIG_BT_BREDR is not set
# CONFIG_BT_DEBUGFS is not set

# Bluetooth host-controller transports and their protocol helpers.
# CONFIG_BT_HCIBTUSB is not set
# CONFIG_BT_HCIUART is not set
# CONFIG_BT_HCIUART_H4 is not set
# CONFIG_BT_HCIUART_BCSP is not set
# CONFIG_BT_HCIUART_ATH3K is not set
# CONFIG_BT_HCIUART_LL is not set
# CONFIG_BT_HCIUART_3WIRE is not set
# CONFIG_BT_HCIUART_INTEL is not set
# CONFIG_BT_HCIUART_BCM is not set
# CONFIG_BT_HCIUART_QCA is not set
# CONFIG_BT_NXPUART is not set

# CONFIG_BT_LEDS is not set
